name: Lean 4 Verification

on:
  push:
    paths:
      - "**/lean/**"
      - ".github/workflows/lean-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -eux
          curl -sSfL --retry 5 --retry-delay 5 --retry-connrefused \
            -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Build every Lean project under */lean
        run: |
          set -u
          fail=0
          found=0
          while IFS= read -r manifest; do
            dir="$(dirname "$manifest")"
            found=1
            echo "::group::lake build $dir"
            pushd "$dir" >/dev/null
            lake exe cache get >/dev/null 2>&1 || true
            out="$(lake build 2>&1)"
            rc=$?
            printf '%s\n' "$out"
            if [ $rc -ne 0 ]; then
              echo "::error::BUILD_FAIL $dir"
              fail=1
            else
              echo "BUILD_OK: $dir"
            fi
            if printf '%s\n' "$out" | grep -q "declaration uses 'sorry'"; then
              echo "::warning::INCOMPLETE $dir 使用了 sorry，不足以判定为 L3"
            else
              echo "NO_SORRY: $dir"
            fi
            if grep -rnE '^[[:space:]]*axiom[[:space:]]' --include='*.lean' . ; then
              echo "::warning::AXIOM_DECL $dir 含自定义 axiom，不足以判定为 L3"
            else
              echo "NO_AXIOM: $dir"
            fi
            popd >/dev/null
            echo "::endgroup::"
          done < <(find . -path '*/lean/lakefile.toml' -o -path '*/lean/lakefile.lean' | sort)
          if [ "$found" -eq 0 ]; then
            echo "No Lean project found, nothing to verify."
          fi
          exit $fail
